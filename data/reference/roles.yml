# 직책 사전
#
# slots  : 메인 매트릭스 표의 '열'이 되는 표준 직책 슬롯.
#          원본 파일의 열 머리글(headers)과 자유 서술 직책(patterns)을 이 슬롯으로 모은다.
# ranks  : 직급 계층. 팝업/정렬/검색 가중치에 사용.
# depts  : 부서 표기 정규화 (출입기자 그룹핑용).

slots:
  - code: 대표
    label: 대표
    order: 10
    headers: [대표, 대표이사, 발행인]
    patterns: [회장, 사장, 대표이사, 발행인, 부회장]
  - code: 편집국장
    label: 편집국장
    order: 20
    headers: [편집국장, 편집인]
    patterns: [편집국장, 편집인, 뉴스룸국장, 뉴스룸 국장, 콘텐트국장, 신문총괄부문장, 편집국장 대리, 보도국장]
  - code: 산업부장
    label: 산업부장
    order: 30
    headers: [산업부장, 산업1부장, 산업2부장]
    patterns:
      [
        산업부장,
        산업1부장,
        산업2부장,
        산업IT부장,
        테크부장,
        경제산업부장,
        경제산업에디터,
        산업에디터,
        경제산업디렉터,
        경제산업부디렉터,
        경제산업부국장,
        경제산업기획부국장,
        경제산업문화부문장,
        경제산업담당,
        산업부문장,
        산업매니징에디터,
        테크성장부장,
        정보미디어부장,
        정보미디어과학부장,
        IT과학부장,
        ICT부장,
        ICT과학부장,
        미래산업부장,
        통신미디어부장,
        테크&사이언스부장,
        산업팀장,
      ]
  - code: 경제부장
    label: 경제부장
    order: 40
    headers: [경제부장, 경제에디터]
    patterns: [경제부장, 경제에디터, 금융부장, 경제금융부장, 경제금융에디터, 소비자경제부장, 경제정책부장, 정책부문장, 재정금융팀장]
  - code: 증권부장
    label: 증권부장
    order: 50
    headers: [증권부장]
    patterns: [증권부장, 증권, 마켓인사이트부장, 마켓시그널부장, 디지털금융부장]
  - code: 사회부장
    label: 사회부장
    order: 60
    headers: [사회부장, 사회부장 ①, 사회부장 ②, 사회부장①, 사회부장②, 사회데스크]
    patterns: [사회부장, 사회에디터, 사회데스크, 사회정책부장, 정책사회부장, 사회1부장, 사회2부장, 전국부장, 사회부국장, 사회디렉터]
  - code: 정치부장
    label: 정치부장
    order: 70
    headers: [정치부장]
    patterns: [정치부장, 정치에디터, 정치데스크, 정치국제에디터, 정치외교국제부국장, 정치국제사회부문장, 정치사회담당, 정치팀장]
  - code: 논설실장
    label: 논설실장
    order: 80
    headers: [논설실장, 주필]
    patterns: [논설실장, 논설주간, 주필, 수석논설위원, 논설위원실장, 오피니언팀장]
  - code: 온라인부장
    label: 온라인부장
    order: 90
    headers: [온라인부장, 디지털부장]
    patterns:
      [
        온라인부장,
        디지털뉴스부장,
        디지털뉴스에디터,
        디지털뉴스,
        디지털콘텐츠부장,
        디지털미디어국장,
        디지털뉴스룸,
        디지털뉴스팀,
        디지털랩장,
        디지털부국장,
        온라인뉴스부장,
        콘텐츠편집부장,
        이슈365부장,
        기획부장,
      ]
  - code: 법조팀장
    label: 법조팀장
    order: 100
    headers: [법조팀장]
    patterns: [법조팀장, 법조부장]

ranks:
  - code: 경영
    order: 10
    patterns: [회장, 부회장, 사장, 대표이사, 대표, 발행인, 편집인]
  - code: 국장
    order: 20
    patterns: [국장, 부국장, 편집국장, 주필, 논설실장, 논설주간, 부문장, 매니징에디터, 디렉터, 실장]
  - code: 부장
    order: 30
    patterns: [부장, 에디터, 부디렉터]
  - code: 차장
    order: 40
    patterns: [차장, 팀장]
  - code: 기자
    order: 50
    patterns: [기자]

# 출입기자 부서 표기 정규화 (좌: 정규형, 우: 원본 표기들)
depts:
  산업부: [산업부, 산업1부, 산업2부, 산업, 경제산업부, 산업팀, 재계, 재계통신]
  테크부: [테크부, 테크, 테크성장부, 테크&사이언스]
  IT과학부: [IT과학부, ICT부, ICT과학부, 정보미디어부, 정보미디어과학, 미래산업부, 통신미디어부, 전자, IT부]
  경제부: [경제부, 금융부, 경제금융부]
  사회부: [사회부, 사회정책부, 정책사회부]
