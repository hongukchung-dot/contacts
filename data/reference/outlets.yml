# - name     : 정식 매체명 (화면 표기 기준)
# - category : 종합지 / 경제지 / 방송 / 통신사 / 전문지 / 영자지 / 기타
# - order    : 화면 정렬 순서 (작을수록 위)
# - aliases  : 원본 파일에 등장하는 표기 변형. 공백은 무시되므로 굳이 넣지 않아도 된다.
#
# 여기에 없는 매체가 파일에 나오면 **새 매체**로 등록되고 '기타'로 표시된다.
# 파싱이 실패하지는 않으며, 검토 화면과 점검 도구에 목록이 뜬다.
#
# ⚠️ 앞부분이 같다고 다른 매체로 이어 붙이지 않는다.
#    조선일보 ≠ 조선비즈, 연합뉴스 ≠ 연합뉴스TV, 한국경제 ≠ 한국경제TV.
#    이런 매체는 반드시 각각 등록해야 하며, 별칭도 서로 겹치면 안 된다.

