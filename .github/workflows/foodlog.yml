name: foodlog

on:
  push:
    branches: ["**"]
    paths:
      - "foodlog/**"
      - ".github/workflows/foodlog.yml"
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r foodlog/server/requirements.txt pytest
      - run: python -m pytest -q foodlog/server

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs (admin + friend)
        working-directory: foodlog/android
        run: ./gradlew assembleAdminDebug assembleFriendDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: foodlog-apks
          path: foodlog/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
